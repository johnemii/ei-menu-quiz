<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>East Izakaya — Menu Categories Trainer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}
h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px;color:#cbd5e1}
.wrap{max-width:680px;margin:auto;padding:14px 12px 80px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px}
button{border:0;border-radius:11px;padding:12px 10px;font-weight:700;font-size:14px;cursor:pointer}
.tab{background:#e5e7eb;color:#374151}.tab.active{background:#111827;color:#fff}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;font-weight:800}
.term{font-size:27px;font-weight:800;margin:5px 0 10px}
.definition{font-size:16px;line-height:1.55;color:#374151}
.example{margin-top:13px;padding:12px;background:#f9fafb;border-radius:10px;font-size:14px;line-height:1.45}
.nav{display:flex;gap:8px;margin-top:15px}.nav button{flex:1;background:#111827;color:#fff}
.nav .secondary{background:#e5e7eb;color:#111827}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 16px}
.progress i{display:block;height:100%;background:#111827;width:0}
.search{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;margin-bottom:12px}
.row{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px}
.row b{display:block;font-size:16px;margin-bottom:4px}.row span{font-size:13px;color:#4b5563}
.choice{width:100%;text-align:left;background:#f3f4f6;margin-top:8px;line-height:1.35}
.choice.correct{background:#dcfce7;color:#166534}.choice.wrong{background:#fee2e2;color:#991b1b}
.feedback{margin-top:12px;font-weight:700}.small{font-size:12px;color:#6b7280}
.hide{display:none!important}
.score{text-align:center;font-size:30px;font-weight:800;padding:12px}
</style>
</head>
<body>
<header>
<h1>East Izakaya — Menu Categories</h1>
<div class="sub">Learn what each section means before memorizing individual dishes.</div>
</header>

<div class="wrap">
<div class="tabs">
<button class="tab active" onclick="showTab('learn',this)">Learn</button>
<button class="tab" onclick="showTab('browse',this)">Browse</button>
<button class="tab" onclick="showTab('quiz',this)">Quiz</button>
</div>

<section id="learn">
<div class="card">
<div class="label">Category <span id="num"></span></div>
<div class="term" id="term"></div>
<div class="definition" id="def"></div>
<div class="example" id="example"></div>
<div class="nav">
<button class="secondary" onclick="prev()">← Previous</button>
<button onclick="next()">Next →</button>
</div>
</div>
<div class="small">Goal: be able to explain what the category is without naming individual menu items.</div>
</section>

<section id="browse" class="hide">
<input id="search" class="search" placeholder="Search categories..." oninput="renderList()">
<div id="list"></div>
</section>

<section id="quiz" class="hide">
<div class="card">
<div class="label">Category Definition Quiz</div>
<div id="qprogress" class="small"></div>
<div class="progress"><i id="bar"></i></div>
<div class="term" id="question"></div>
<div id="choices"></div>
<div id="feedback" class="feedback"></div>
<div class="nav"><button id="nextq" class="hide" onclick="nextQuestion()">Next →</button></div>
</div>
<div id="scorecard" class="card hide"></div>
</section>
</div>

<script>
const categories=[
{t:"Hand Roll",d:"A single-serving sushi roll prepared in a cone shape, typically wrapped in seaweed with sushi rice and fillings. The menu lists these as 1 piece each.",e:"Think: cone-shaped, hand-held sushi; one piece per order."},
{t:"Maki Roll",d:"A traditional rolled sushi format in which ingredients are rolled together with sushi rice and seaweed, then cut into individual pieces. The menu lists these as 8 pieces each.",e:"Think: standard cut sushi roll; 8 pieces per order."},
{t:"Special Roll",d:"A more elaborate sushi-roll category featuring combinations and preparations beyond the basic Maki Roll selection. These are generally designed as specialty combinations and are listed as 8-piece rolls.",e:"Think: upgraded/custom-style rolls with more elaborate combinations."},
{t:"Signature Roll",d:"The restaurant's featured premium-style roll category. These are more elaborate rolls with distinctive combinations and are listed as 8 pieces each.",e:"Think: signature creations that are more distinctive than the regular Maki selection."},
{t:"Torched",d:"A category centered on sushi and rolls finished with a flame-seared or torched preparation. The menu includes both 8-piece rolls and 2-piece sushi.",e:"Think: flame-seared preparation is the defining feature, not the type of protein."},
{t:"Sushi Bar",d:"The section for individual sushi-bar selections, including Sashimi, Nigiri and specialty preparations such as Tataki.",e:"Think: individual pieces/servings rather than rolled sushi."},
{t:"Sashimi",d:"Sushi-bar style seafood served without sushi rice. On this menu, sashimi is priced by order and listed as 3 pieces.",e:"Think: sliced seafood without rice."},
{t:"Nigiri",d:"A sushi-bar preparation consisting of a topping served on a small portion of sushi rice. The menu generally lists Nigiri as 2 pieces.",e:"Think: topping + a small rice base; usually 2 pieces."},
{t:"Tataki",d:"A preparation in which the outside of the main food is briefly seared while the interior remains relatively rare, then served in slices with sauce.",e:"Think: lightly seared exterior, sliced and served as a specialty appetizer/sushi-bar preparation."},
{t:"Sushi Pizza",d:"A specialty menu category built around a crispy hash-brown-style base with sushi toppings and sauces.",e:"Think: sushi ingredients presented in a pizza-like format rather than a roll."},
{t:"Combo",d:"A value-oriented combination meal that groups multiple sushi selections together. The menu includes Sushi, Sashimi and Maki combinations, with miso soup and seaweed salad included.",e:"Think: bundled meal that combines multiple menu formats."},
{t:"Poke Bowl",d:"A bowl-style dish served over sushi rice with a mixture of toppings, finishing elements and sauce. The menu offers Salmon, Tuna and Fruit versions.",e:"Think: deconstructed sushi in a bowl rather than a roll."}
];

let current=0,q=0,score=0,answered=false;
const $=id=>document.getElementById(id);

function render(){
 const x=categories[current];
 $("num").textContent=`${current+1} of ${categories.length}`;
 $("term").textContent=x.t;
 $("def").textContent=x.d;
 $("example").innerHTML="<b>Easy way to remember:</b> "+x.e;
}
function next(){current=(current+1)%categories.length;render()}
function prev(){current=(current-1+categories.length)%categories.length;render()}
function showTab(tab,btn){
 ["learn","browse","quiz"].forEach(x=>$(x).classList.toggle("hide",x!==tab));
 document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
 if(tab==="browse")renderList(); if(tab==="quiz")startQuiz();
}
function renderList(){
 const s=$("search").value.toLowerCase();
 $("list").innerHTML=categories.filter(x=>(x.t+" "+x.d).toLowerCase().includes(s))
 .map(x=>`<div class="row"><b>${x.t}</b><span>${x.d}</span></div>`).join("");
}
function startQuiz(){
 if(q>=categories.length)return;
 answered=false;$("scorecard").classList.add("hide");
 const x=categories[q];
 $("qprogress").textContent=`Question ${q+1} of ${categories.length}`;
 $("bar").style.width=(q/categories.length*100)+"%";
 $("question").textContent=`What is “${x.t}”?`;
 $("feedback").textContent="";$("nextq").classList.add("hide");
 let opts=[x.d,...categories.filter((_,i)=>i!==q).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.d)].sort(()=>Math.random()-.5);
 $("choices").innerHTML=opts.map(o=>`<button class="choice" onclick="answer(this,${o===x.d})">${o}</button>`).join("");
}
function answer(btn,correct){
 if(answered)return;answered=true;
 document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 if(correct){score++;btn.classList.add("correct");$("feedback").textContent="✓ Correct";}
 else{btn.classList.add("wrong");$("feedback").textContent="Not quite. The correct definition is highlighted.";
 const c=[...document.querySelectorAll(".choice")].find(b=>b.textContent===categories[q].d);if(c)c.classList.add("correct")}
 $("nextq").classList.remove("hide");
}
function nextQuestion(){
 q++;
 if(q>=categories.length){
   $("question").textContent="Quiz complete";$("choices").innerHTML="";$("feedback").textContent="";$("bar").style.width="100%";
   $("scorecard").classList.remove("hide");
   $("scorecard").innerHTML=`<div class="score">${score} / ${categories.length}</div><div style="text-align:center">Review the categories, then retake the quiz.</div><div class="nav"><button onclick="resetQuiz()">Retake Quiz</button></div>`;
 }else startQuiz();
}
function resetQuiz(){q=0;score=0;startQuiz()}
render();
</script>
</body>
</html>
